name: Coopwise CI
description: CI workflow for Coopwise project

on:
  push:
    branches: [main, staging, 0G]
  pull_request:
    branches: [main, staging, 0G]

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coopwise
          POSTGRES_PASSWORD: coopwise
          POSTGRES_DB: coopwise_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coopwise -d coopwise_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: test
      PROJECT_NAME: Coopwise
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://coopwise:coopwise@localhost:5432/coopwise_db
      APP_SECRET_KEY: secret
      ALGORITHM: HS256
      REDIS_URL: redis://localhost:6379/0
      PAYSTACK_PUBLIC_KEY: test
      PAYSTACK_SECRET_KEY: test
      CASHRAMP_PUBKEY: test
      CASHRAMP_SECKEY: test
      GEMINI_API_KEY: test
      CLIENT_DOMAIN: http://localhost:3000
      DOMAIN: http://localhost:8000
      INVITE_CODE_PREFIX: XYZ
      RATE_LIMIT_RULES_PATH: rate_limit_rules.json
      CROSSMINT_SERVER_API_KEY: test
      CROSSMINT_SERVER_SIGNER_ADDRESS: test
      CROSSMINT_CHAIN: solana
      CROSSMINT_AUDIENCE: test
      FIREBASE_PROJECT_ID: test
      RESEND_API_KEY: test
      EMAIL_FROM_ADDRESS: test@example.com
      SMS_PROVIDER_API_KEY: test
      SMS_SENDER_ID: test
      SMS_PROVIDER_BASE_URL: https://example.com
      KYC_WEBHOOK_SECRET: test
      CLOUDINARY_URL: cloudinary://test:test@test
      MAIL_USERNAME: test
      MAIL_PASSWORD: test
      MAIL_FROM: test@example.com
      # Throwaway Fernet key (must be valid 32-byte urlsafe base64) — test-only.
      SECRET_ENCRYPTION_KEY: JoOh0nC3Sjw0jGdokAgDTq6oMYKcdeunmptLQeoTceQ=
      JWT_KID: test-key-1
      JWT_PRIVATE_KEY: 
      JWT_PUBLIC_KEY: 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Lint with Black
        run: black --check --diff .

      - name: Run database migrations
        run: alembic upgrade head

      - name: Seed reference data
        run: python scripts/seed_beneficiary_patterns.py
        env:
          PYTHONPATH: .

      - name: Run unit tests (fast, no DB)
        run: pytest -m unit -v

      - name: Run full test suite
        run: pytest -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml

  frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint
